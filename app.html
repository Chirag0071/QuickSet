<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickBite Food Delivery</title>
  <link rel="stylesheet" href="app1.css">
</head>
<body>
  <header>
    <h1>QuickBite</h1>
    <nav>
      <a href="#menu">Menu</a>
      <a href="#cart">Cart (<span id="cart-count">0</span>)</a>
    </nav>
  </header>

  <main>
    <section id="menu">
      <h2>Popular Dishes</h2>
      <div class="menu-grid">
        <article class="food-card" data-id="1">
          <h3>Classic Cheeseburger</h3>
          <p class="price">$9.99</p>
          <button class="add-btn">Add to Cart</button>
        </article>
        <article class="food-card" data-id="2">
          <h3>Margherita Pizza</h3>
          <p class="price">$12.99</p>
          <button class="add-btn">Add to Cart</button>
        </article>
        <article class="food-card" data-id="3">
          <h3>Crispy Fried Chicken</h3>
          <p class="price">$11.49</p>
          <button class="add-btn">Add to Cart</button>
        </article>
        <article class="food-card" data-id="4">
          <h3>Fresh Garden Salad</h3>
          <p class="price">$7.99</p>
          <button class="add-btn">Add to Cart</button>
        </article>
      </div>
    </section>

    <aside id="cart">
      <h2>Your Order</h2>
      <ul id="cart-items">
        <li class="empty-msg">Your cart is empty</li>
      </ul>
      <div class="cart-total">
        <span>Total:</span>
        <strong id="total-price">$0.00</strong>
      </div>
      <button id="checkout-btn">Proceed to Checkout</button>
    </aside>
  </main>

  <script src="app2.js"></script>
</body>
</html>
